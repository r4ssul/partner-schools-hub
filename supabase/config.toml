project_id = "partner-schools-hub"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://r4ssul.github.io/partner-schools-hub/"
additional_redirect_urls = [
  "https://r4ssul.github.io/partner-schools-hub/accept-invite",
  "https://r4ssul.github.io/partner-schools-hub/reset-password",
  "http://127.0.0.1:5173/accept-invite",
  "http://127.0.0.1:5173/reset-password"
]
enable_signup = false
minimum_password_length = 10

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.manage-members]
verify_jwt = true

[functions.file-access]
verify_jwt = true

[functions.dispatch-notifications]
verify_jwt = false
